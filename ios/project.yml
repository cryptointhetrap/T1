name: TrainingMonitor
options:
  bundleIdPrefix: com.trainingmonitor
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  TrainingMonitor:
    type: application
    platform: iOS
    sources:
      - path: TrainingMonitor/App
      - path: TrainingMonitor/Config
      - path: TrainingMonitor/Models
      - path: TrainingMonitor/Services
      - path: TrainingMonitor/ViewModels
      - path: TrainingMonitor/Views
      - path: TrainingMonitor/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trainingmonitor.app
        INFOPLIST_FILE: TrainingMonitor/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TrainingMonitor/TrainingMonitor.entitlements
    scheme:
      testable: false
